<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>natlagildr.github.io — Cozy Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EC;
    --grid-line: rgba(122, 31, 36, 0.06);
    --grid-dot: rgba(122, 31, 36, 0.16);
    --pill-bg: rgba(255, 252, 247, 0.92);
    --pill-border: rgba(122, 31, 36, 0.14);
    --text: #2A211E;
    --muted: #7B6D68;
    --accent: #7A1F24;
    --shadow: 0 10px 28px rgba(42, 33, 30, 0.08);
  }
  body.dark {
    --bg: #191614;
    --grid-line: rgba(255, 235, 220, 0.04);
    --grid-dot: rgba(255, 235, 220, 0.11);
    --pill-bg: rgba(34, 29, 26, 0.92);
    --pill-border: rgba(255, 225, 210, 0.12);
    --text: #F4EDE4;
    --muted: #A4968E;
    --accent: #D6686E;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background-color: var(--bg);
    background-image:
      radial-gradient(var(--grid-dot) 1.25px, transparent 1.25px),
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px, 32px 32px;
    background-position: 16px 16px, 0 0, 0 0;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  /* Minimal Floating Pills */
  .hud-top {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--pill-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 8px 15px;
    box-shadow: var(--shadow);
    font-size: 13px;
    font-weight: 600;
    max-width: 100%;
  }
  .brand-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .dom-short { display: none; }
  .dot-live {
    width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #22C55E;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
  }
  .presence {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 2px;
    padding-left: 8px; border-left: 1px solid var(--pill-border);
    flex-shrink: 0;
  }
  .p-dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.35; transition: 0.3s; }
  .p-dot.blue { background: #60A5FA; }
  .p-dot.pink { background: #F472B6; }
  .p-dot.on { opacity: 1; transform: scale(1.15); }

  .icon-group { display: flex; align-items: center; gap: 3px; }
  .icon-btn {
    border: none; background: transparent; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    transition: background 0.2s, transform 0.15s;
  }
  .icon-btn:hover { background: rgba(122, 31, 36, 0.1); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active { background: var(--accent); color: #fff; }
  .clock-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    padding: 4px 6px; color: var(--muted); cursor: pointer;
    border-radius: 999px; white-space: nowrap;
  }
  .clock-badge:hover { background: rgba(122, 31, 36, 0.08); }

  /* Time Popover */
  .time-pop {
    position: fixed;
    top: calc(max(14px, env(safe-area-inset-top)) + 48px);
    right: max(14px, env(safe-area-inset-right));
    z-index: 25;
    background: var(--pill-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--pill-border);
    border-radius: 18px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    display: none; flex-direction: column; gap: 8px; width: 215px;
  }
  .time-pop.open { display: flex; }
  .time-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .t-btn {
    border: 1px solid var(--pill-border); background: transparent; color: var(--text);
    border-radius: 8px; padding: 6px 0; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .t-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Stage */
  #stage-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#roomCanvas {
    width: 100%; height: 100%;
    touch-action: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
  }

  /* Hover / Touch Tooltip */
  #tooltip {
    position: fixed; pointer-events: none; z-index: 30;
    background: var(--accent); color: #fff;
    padding: 5px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    box-shadow: 0 6px 16px rgba(122, 31, 36, 0.28);
    transform: translate(-50%, -140%);
    opacity: 0; transition: opacity 0.16s ease;
    white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }

  /* Bottom Portal Dock */
  .hud-bottom {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex; align-items: center; gap: 6px;
    max-width: calc(100vw - 24px);
    background: var(--pill-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 6px 8px;
    box-shadow: var(--shadow);
  }
  .dock-btn {
    border: none; background: transparent; color: var(--text);
    padding: 8px 14px; border-radius: 999px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .dock-btn:hover { background: rgba(122, 31, 36, 0.09); }
  .dock-btn:active { transform: scale(0.95); }
  .dock-btn.primary { background: var(--accent); color: #fff; }
  .dock-btn.primary:hover { filter: brightness(1.08); }
  .divider { width: 1px; height: 18px; background: var(--pill-border); flex-shrink: 0; }

  /* 3D Unfold Portal Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20, 16, 14, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    opacity: 0; pointer-events: none;
    perspective: 1400px; transition: opacity 0.28s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: min(960px, 96vw);
    height: min(640px, 86dvh);
    background: var(--bg); border: 1px solid var(--pill-border);
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
    display: flex; flex-direction: column;
    transform-origin: center bottom;
    transform: rotateX(18deg) scale(0.92) translateY(24px);
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .modal-backdrop.open .modal-card {
    transform: rotateX(0deg) scale(1) translateY(0);
  }
  .modal-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; background: var(--pill-bg);
    border-bottom: 1px solid var(--pill-border);
  }
  .url-box {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
    background: rgba(122, 31, 36, 0.06); border: 1px solid var(--pill-border);
    border-radius: 999px; padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
  }
  .url-box input {
    flex: 1; min-width: 0; border: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 12px; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .modal-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .m-btn {
    border: 1px solid var(--pill-border); background: transparent; color: var(--text);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .m-btn.close { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-frame-wrap { position: relative; flex: 1; background: #fff; -webkit-overflow-scrolling: touch; }
  .modal-frame-wrap iframe { width: 100%; height: 100%; border: none; }

  /* Responsive Mobile & Tablet Breakpoints */
  @media (max-width: 640px) {
    .hud-top {
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
    }
    .pill {
      padding: 6px 10px;
      gap: 6px;
      font-size: 12px;
    }
    .brand-title { font-size: 13.5px; }
    .presence { padding-left: 6px; gap: 3px; }
    .icon-group { gap: 1px; }
    .icon-btn { width: 28px; height: 28px; font-size: 13px; }
    .clock-badge { font-size: 11px; padding: 3px 5px; }
    .time-pop {
      top: calc(max(10px, env(safe-area-inset-top)) + 44px);
      right: 10px;
    }
    .hud-bottom {
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 5px 6px;
      gap: 4px;
    }
    .dock-btn {
      padding: 7px 11px;
      font-size: 12px;
      gap: 5px;
    }
    .modal-card {
      width: 96vw;
      height: 88dvh;
      border-radius: 18px;
    }
    .modal-bar { padding: 8px 10px; gap: 6px; }
    .m-btn { padding: 6px 10px; font-size: 11.5px; }
  }

  @media (max-width: 420px) {
    .dom-full { display: none; }
    .dom-short { display: inline; }
    .full-label-extra { display: none; }
    .dock-btn { padding: 7px 9px; font-size: 11.5px; }
  }
</style>
</head>
<body>

<div class="hud-top">
  <div class="pill">
    <span class="dot-live"></span>
    <span class="brand-title">
      <span class="dom-full">natlagildr.github.io</span>
      <span class="dom-short">natlagildr</span>
    </span>
    <div class="presence" title="Status Online Berdua">
      <span class="p-dot blue on" id="dotBlue"></span>
      <span class="p-dot pink" id="dotPink"></span>
    </div>
  </div>

  <div class="pill icon-group">
    <span class="clock-badge" id="clockText" title="Ubah Simulasi Waktu">14:00</span>
    <button class="icon-btn" id="btnLamp" title="Lampu Kamar">💡</button>
    <button class="icon-btn" id="btnDecor" title="Geser Barang (Decor Mode)">🪑</button>
    <button class="icon-btn" id="btnResetDecor" title="Reset Posisi Barang" style="display:none;">↺</button>
    <button class="icon-btn" id="btnAudio" title="Suara Efek">🔊</button>
    <button class="icon-btn" id="btnTheme" title="Mode Gelap/Terang">🌙</button>
  </div>
</div>

<div class="time-pop" id="timePop">
  <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;">
    <span>Simulasi Waktu</span>
    <button class="t-btn" id="btnAutoTime" style="padding:3px 9px;">Auto</button>
  </div>
  <input type="range" id="timeSlider" min="0" max="23" value="14" style="accent-color:var(--accent);width:100%;height:24px;">
  <div class="time-presets">
    <button class="t-btn" data-hr="8">Pagi</button>
    <button class="t-btn active" data-hr="14">Siang</button>
    <button class="t-btn" data-hr="18">Sore</button>
    <button class="t-btn" data-hr="23">Tidur</button>
  </div>
</div>

<div id="stage-wrap">
  <canvas id="roomCanvas"></canvas>
</div>
<div id="tooltip"></div>

<div class="hud-bottom">
  <button class="dock-btn primary" data-portal="surat">💌 Surat</button>
  <div class="divider"></div>
  <button class="dock-btn" data-portal="photobooth">📸 Photobooth</button>
  <div class="divider"></div>
  <button class="dock-btn" data-portal="games">🎮 Games</button>
</div>

<!-- 3D Portal Modal -->
<div class="modal-backdrop" id="portalModal">
  <div class="modal-card">
    <div class="modal-bar">
      <div class="url-box">
        <span>🔒</span>
        <input type="text" id="portalUrlInput" spellcheck="false" />
      </div>
      <div class="modal-actions">
        <a class="m-btn" id="portalFullBtn" href="#" target="_blank" rel="noopener">⛶ Full<span class="full-label-extra"> Layar</span></a>
        <button class="m-btn close" id="portalCloseBtn">✕ Tutup</button>
      </div>
    </div>
    <div class="modal-frame-wrap">
      <iframe id="portalIframe" allow="camera; microphone; fullscreen" loading="lazy"></iframe>
    </div>
  </div>
</div>

<!-- Firebase SDK (Opsional untuk Sync Real-time Berdua) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
(() => {
  // =========================================================================
  // 1. KONFIGURASI PORTAL REPO & FIREBASE
  // =========================================================================
  const PORTALS = {
    surat:      { label: 'Kapsul Waktu (Surat)', url: 'https://natlagildr.github.io/kapsul-waktu' },
    photobooth: { label: 'Photobooth Berdua',    url: 'https://natlagildr.github.io/photobooth' },
    games:      { label: 'Mini Games',           url: 'https://natlagildr.github.io/games' }
  };

  // Tempelkan config Firebase Realtime Database kamu di sini nanti agar sync real-time berdua aktif:
  const FIREBASE_CONFIG = {
    apiKey: "",
    authDomain: "",
    databaseURL: "",
    projectId: ""
  };

  let db = null;
  let roomRef = null;
  const sessionId = Math.random().toString(36).slice(2, 9);

  // =========================================================================
  // 2. MUAT ASET PNG TERPISAH DARI FOLDER ./assets/
  // =========================================================================
  const ASSET_FILES = [
    'kamar_base',
    'gorden_tutup', 'gorden_buka',
    'beanbag', 'karpet', 'tanaman', 'guling', 'bantal',
    'kucing_tidur', 'kucing_duduk', 'kucing_senang',
    'biru_diam', 'biru_jalan1', 'biru_jalan2', 'biru_tidur',
    'pink_diam', 'pink_jalan1', 'pink_jalan2', 'pink_tidur'
  ];

  const IMG = {};
  let loadedCount = 0;

  function loadAllAssets(onReady) {
    ASSET_FILES.forEach(key => {
      const im = new Image();
      im.onload = () => {
        IMG[key] = im;
        loadedCount++;
        if (loadedCount === ASSET_FILES.length) onReady();
      };
      im.onerror = () => {
        console.warn('Gagal memuat aset:', key);
        loadedCount++;
        if (loadedCount === ASSET_FILES.length) onReady();
      };
      im.src = `./assets/${key}.png`;
    });
  }

  // =========================================================================
  // 3. STATE KAMAR & SINKRONISASI
  // =========================================================================
  const DEFAULT_DECORS = {
    karpet:  { x: 358, y: 508, label: 'Karpet Lilac' },
    beanbag: { x: 285, y: 355, label: 'Beanbag Biru' },
    tanaman: { x: 385, y: 288, label: 'Tanaman Pot' },
    guling:  { x: 256, y: 362, label: 'Guling Kuning' },
    bantal:  { x: 318, y: 388, label: 'Bantal Hijau' }
  };

  let roomState = {
    curtainOpen: true,
    lampOn: false,
    catMood: 'sleep',
    catHappyUntil: 0,
    decors: JSON.parse(localStorage.getItem('natla_decors_v2') || 'null') || JSON.parse(JSON.stringify(DEFAULT_DECORS))
  };

  function initFirebase() {
    if (!FIREBASE_CONFIG.databaseURL || typeof firebase === 'undefined') return;
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
      roomRef = db.ref('cozy_room_v2');

      const myPresence = roomRef.child('presence/' + sessionId);
      myPresence.set(true);
      myPresence.onDisconnect().remove();
      roomRef.child('presence').on('value', snap => {
        const count = snap.numChildren();
        document.getElementById('dotPink').classList.toggle('on', count >= 2);
      });

      roomRef.child('state').on('value', snap => {
        const val = snap.val();
        if (!val) return;
        if (typeof val.curtainOpen === 'boolean') roomState.curtainOpen = val.curtainOpen;
        if (typeof val.lampOn === 'boolean') roomState.lampOn = val.lampOn;
        if (val.decors) roomState.decors = val.decors;
        if (val.pingAt && Date.now() - val.pingAt < 3000) {
          spawnHeart(365, 360);
          playTone(660, 'sine', 0.12);
        }
        updateUIButtons();
      });
    } catch (e) {
      console.warn('Firebase fallback ke mode lokal:', e);
    }
  }

  function pushState(ping = false) {
    localStorage.setItem('natla_decors_v2', JSON.stringify(roomState.decors));
    if (roomRef) {
      const payload = {
        curtainOpen: roomState.curtainOpen,
        lampOn: roomState.lampOn,
        decors: roomState.decors
      };
      if (ping) payload.pingAt = Date.now();
      roomRef.child('state').update(payload);
    }
  }

  // =========================================================================
  // 4. EFEK SUARA 8-BIT (WEB AUDIO API)
  // =========================================================================
  let audioEnabled = true;
  let audioCtx = null;

  function playTone(freq, type = 'triangle', dur = 0.09, slideTo = null) {
    if (!audioEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  function playMeow() {
    playTone(540, 'triangle', 0.22, 760);
    setTimeout(() => playTone(720, 'triangle', 0.25, 440), 110);
  }

  // =========================================================================
  // 5. ENGINE RENDERING KANVAS 2.5D & NAVMESH PATHFINDING ANTI-NEMBUS KASUR
  // =========================================================================
  const canvas = document.getElementById('roomCanvas');
  const ctx = canvas.getContext('2d');
  const BASE_W = 730;
  const BASE_H = 700;

  const roomBuffer = document.createElement('canvas');
  roomBuffer.width = BASE_W;
  roomBuffer.height = BASE_H;
  const rctx = roomBuffer.getContext('2d');

  let manualHour = null;
  let decorMode = false;
  let draggingKey = null;
  let dragOffset = { x: 0, y: 0 };
  let particles = [];

  const WALK_NODES = [
    { x: 356, y: 332 }, // 0: Depan papan surat
    { x: 412, y: 370 }, // 1: Dekat meja belajar
    { x: 415, y: 440 }, // 2: Tengah ruangan (kanan kasur)
    { x: 432, y: 506 }, // 3: Depan tengah (kiri kamera tripod)
    { x: 374, y: 592 }, // 4: Ujung lantai depan bawah
    { x: 262, y: 578 }, // 5: Depan kaki kasur
    { x: 184, y: 534 }  // 6: Lantai depan kiri
  ];

  const WALK_EDGES = {
    0: [1, 2],
    1: [0, 2],
    2: [0, 1, 3],
    3: [2, 4],
    4: [3, 5],
    5: [4, 6],
    6: [5]
  };

  function findNodePath(startIdx, endIdx) {
    if (startIdx === endIdx) return [endIdx];
    const queue = [[startIdx]];
    const visited = new Set([startIdx]);
    while (queue.length > 0) {
      const path = queue.shift();
      const curr = path[path.length - 1];
      for (const nxt of (WALK_EDGES[curr] || [])) {
        if (nxt === endIdx) return [...path, nxt];
        if (!visited.has(nxt)) {
          visited.add(nxt);
          queue.push([...path, nxt]);
        }
      }
    }
    return [endIdx];
  }

  const mascots = [
    {
      id: 'blue', prefix: 'biru',
      x: 412, y: 370, currentNode: 1, pathQueue: [],
      bedX: 162, bedY: 396,
      inBed: false,
      speed: 0.55, stepTimer: 0, frame: 0, waitTimer: 65, jumpY: 0, jumpVel: 0
    },
    {
      id: 'pink', prefix: 'pink',
      x: 374, y: 592, currentNode: 4, pathQueue: [],
      bedX: 232, bedY: 434,
      inBed: false,
      speed: 0.50, stepTimer: 12, frame: 0, waitTimer: 35, jumpY: 0, jumpVel: 0
    }
  ];

  function getActiveHour() {
    return manualHour !== null ? manualHour : new Date().getHours();
  }

  function isSleepTime() {
    const hr = getActiveHour();
    return hr >= 22 || hr < 6;
  }

  function spawnHeart(x, y) {
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 26,
        y: y - 10 - Math.random() * 14,
        vy: -0.6 - Math.random() * 0.4,
        alpha: 1,
        text: '♥'
      });
    }
  }

  const HIT_ZONES = [
    { id: 'curtain',    label: 'Gorden (Buka/Tutup)', x: 195, y: 85,  w: 135, h: 190 },
    { id: 'surat',      label: '💌 Buka Kapsul Waktu', x: 382, y: 112, w: 110, h: 125 },
    { id: 'games',      label: '🎮 Buka Mini Games',   x: 452, y: 248, w: 145, h: 135 },
    { id: 'photobooth', label: '📸 Buka Photobooth',   x: 472, y: 425, w: 74,  h: 135 }
  ];

  function getStageTransform(cw, ch) {
    const isMobile = cw < 640;
    const fillRatio = isMobile ? 0.98 : 0.94;
    const scale = Math.min(cw / BASE_W, ch / BASE_H) * fillRatio;
    const ox = (cw - BASE_W * scale) / 2;
    const oy = (ch - BASE_H * scale) / 2 - (isMobile && ch > cw ? 6 : 0);
    return { scale, ox, oy };
  }

  function screenToBase(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const { scale, ox, oy } = getStageTransform(rect.width, rect.height);
    return {
      x: (clientX - rect.left - ox) / scale,
      y: (clientY - rect.top - oy) / scale
    };
  }

  function updateSimulation() {
    const sleeping = isSleepTime();

    if (roomState.catMood === 'happy' && Date.now() > roomState.catHappyUntil) {
      roomState.catMood = sleeping ? 'sleep' : 'sit';
    } else if (roomState.catMood !== 'happy') {
      roomState.catMood = sleeping ? 'sleep' : (Math.sin(Date.now() / 6000) > 0.2 ? 'sit' : 'sleep');
    }

    mascots.forEach(m => {
      if (m.jumpY < 0 || m.jumpVel !== 0) {
        m.jumpY += m.jumpVel;
        m.jumpVel += 0.45;
        if (m.jumpY >= 0) {
          m.jumpY = 0;
          m.jumpVel = 0;
        }
      }

      if (sleeping) {
        if (!m.inBed) {
          const bedsideNode = m.id === 'blue' ? 2 : 5;
          if (m.currentNode !== bedsideNode && m.pathQueue.length === 0) {
            m.pathQueue = findNodePath(m.currentNode, bedsideNode).slice(1);
          }
          if (m.pathQueue.length > 0) {
            stepAlongPath(m);
            return;
          }
          m.inBed = true;
        }
        m.x += (m.bedX - m.x) * 0.12;
        m.y += (m.bedY - m.y) * 0.12;
        m.frame = 0;
        return;
      }

      if (m.inBed) {
        const exitNode = m.id === 'blue' ? 2 : 5;
        const exitPt = WALK_NODES[exitNode];
        const dx = exitPt.x - m.x;
        const dy = exitPt.y - m.y;
        if (Math.hypot(dx, dy) > 6) {
          m.x += dx * 0.12;
          m.y += dy * 0.12;
          return;
        }
        m.x = exitPt.x;
        m.y = exitPt.y;
        m.currentNode = exitNode;
        m.inBed = false;
        m.waitTimer = 25;
      }

      if (m.pathQueue.length > 0) {
        stepAlongPath(m);
      } else if (m.waitTimer > 0) {
        m.waitTimer--;
        m.frame = 0;
        if (m.waitTimer === 0) {
          let targetNode = Math.floor(Math.random() * WALK_NODES.length);
          if (targetNode === m.currentNode) {
            targetNode = (m.currentNode + 2) % WALK_NODES.length;
          }
          m.pathQueue = findNodePath(m.currentNode, targetNode).slice(1);
        }
      }
    });

    particles.forEach(p => {
      p.y += p.vy;
      p.alpha -= 0.015;
    });
    particles = particles.filter(p => p.alpha > 0);
  }

  function stepAlongPath(m) {
    const nextIdx = m.pathQueue[0];
    const target = WALK_NODES[nextIdx];
    const dx = target.x - m.x;
    const dy = target.y - m.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= m.speed * 1.5) {
      m.x = target.x;
      m.y = target.y;
      m.currentNode = nextIdx;
      m.pathQueue.shift();
      if (m.pathQueue.length === 0) {
        m.waitTimer = 65 + Math.floor(Math.random() * 95);
        m.frame = 0;
      }
    } else {
      m.x += (dx / dist) * m.speed;
      m.y += (dy / dist) * m.speed;
      m.stepTimer++;
      if (m.stepTimer % 13 === 0) {
        m.frame = m.frame === 1 ? 2 : 1;
      }
    }
  }

  function render() {
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    if (canvas.width !== cw * dpr || canvas.height !== ch * dpr) {
      canvas.width = cw * dpr;
      canvas.height = ch * dpr;
    }

    rctx.save();
    rctx.clearRect(0, 0, BASE_W, BASE_H);
    rctx.imageSmoothingEnabled = false;

    if (IMG.kamar_base) {
      rctx.drawImage(IMG.kamar_base, 10, 10);
    }

    const hr = getActiveHour();
    const isNight = (hr >= 19 || hr < 6);

    if (isNight) {
      rctx.save();
      rctx.beginPath();
      rctx.moveTo(219, 154);
      rctx.lineTo(298, 109);
      rctx.lineTo(298, 209);
      rctx.lineTo(219, 254);
      rctx.closePath();
      rctx.fillStyle = 'rgba(18, 26, 62, 0.78)';
      rctx.fill();

      const twinkle = 0.55 + 0.45 * Math.sin(Date.now() / 420);
      rctx.fillStyle = `rgba(255, 248, 200, ${twinkle.toFixed(2)})`;
      rctx.fillRect(242, 165, 3, 3);
      rctx.fillRect(276, 138, 2, 2);
      rctx.fillRect(265, 185, 2, 2);
      rctx.fillRect(234, 212, 3, 3);
      rctx.restore();
    }

    if (roomState.curtainOpen && hr >= 6 && hr <= 17) {
      rctx.save();
      const grad = rctx.createLinearGradient(230, 130, 420, 460);
      grad.addColorStop(0, 'rgba(255, 244, 195, 0.34)');
      grad.addColorStop(1, 'rgba(255, 244, 195, 0.0)');
      rctx.fillStyle = grad;
      rctx.beginPath();
      rctx.moveTo(215, 130);
      rctx.lineTo(315, 82);
      rctx.lineTo(485, 380);
      rctx.lineTo(335, 455);
      rctx.closePath();
      rctx.fill();
      rctx.restore();
    }

    const curtainImg = roomState.curtainOpen ? IMG.gorden_buka : IMG.gorden_tutup;
    if (curtainImg) {
      rctx.save();
      rctx.translate(195, 141);
      rctx.transform(1, -0.436, 0, 1, 0, 0);
      rctx.drawImage(curtainImg, 0, 0, 135, 144);
      rctx.restore();
    }

    const karpet = roomState.decors.karpet;
    if (IMG.karpet && karpet) {
      drawCenteredSprite(rctx, IMG.karpet, karpet.x, karpet.y, 1.15);
    }

    const drawList = [];

    Object.entries(roomState.decors).forEach(([key, d]) => {
      if (key === 'karpet') return;
      const spr = IMG[key];
      if (spr) {
        drawList.push({
          y: d.y,
          draw: () => {
            drawCenteredSprite(rctx, spr, d.x, d.y, 0.90);
            if (decorMode) {
              rctx.save();
              rctx.strokeStyle = '#7A1F24';
              rctx.setLineDash([4, 3]);
              rctx.lineWidth = 1.5;
              rctx.strokeRect(d.x - spr.width * 0.45, d.y - spr.height * 0.85, spr.width * 0.90, spr.height * 0.88);
              rctx.restore();
            }
          }
        });
      }
    });

    const catX = karpet ? karpet.x + 6 : 364;
    const catY = karpet ? karpet.y + 3 : 511;
    const catKey = roomState.catMood === 'happy' ? 'kucing_senang'
                 : roomState.catMood === 'sit'   ? 'kucing_duduk' : 'kucing_tidur';
    if (IMG[catKey]) {
      const breathe = roomState.catMood === 'sleep' ? Math.sin(Date.now() / 550) * 1.1 : 0;
      drawList.push({
        y: catY,
        draw: () => drawCenteredSprite(rctx, IMG[catKey], catX, catY + breathe, 0.72)
      });
    }

    const sleeping = isSleepTime();
    mascots.forEach(m => {
      const isSleepingPose = sleeping && m.inBed;
      const key = isSleepingPose
        ? `${m.prefix}_tidur`
        : m.frame === 1 ? `${m.prefix}_jalan1`
        : m.frame === 2 ? `${m.prefix}_jalan2` : `${m.prefix}_diam`;
      const spr = IMG[key];
      if (spr) {
        drawList.push({
          y: m.y,
          draw: () => {
            if (!isSleepingPose) {
              rctx.save();
              rctx.fillStyle = 'rgba(42, 33, 30, 0.18)';
              rctx.beginPath();
              rctx.ellipse(m.x, m.y - 2, 16, 6, 0, 0, Math.PI * 2);
              rctx.fill();
              rctx.restore();
            }
            const bob = (!isSleepingPose && m.frame > 0) ? -3 : 0;
            drawCenteredSprite(rctx, spr, m.x, m.y + m.jumpY + bob, isSleepingPose ? 0.74 : 0.78);
          }
        });
      }
    });

    drawList.sort((a, b) => a.y - b.y);
    drawList.forEach(item => item.draw());

    rctx.save();
    rctx.globalCompositeOperation = 'source-atop';
    if (hr >= 17 && hr <= 18) {
      rctx.fillStyle = 'rgba(235, 118, 60, 0.16)';
      rctx.fillRect(0, 0, BASE_W, BASE_H);
    } else if (isNight) {
      rctx.fillStyle = roomState.lampOn ? 'rgba(18, 22, 52, 0.28)' : 'rgba(14, 18, 46, 0.44)';
      rctx.fillRect(0, 0, BASE_W, BASE_H);
    }

    if (roomState.lampOn) {
      const lampGrad = rctx.createRadialGradient(575, 295, 8, 560, 325, 185);
      lampGrad.addColorStop(0, 'rgba(255, 226, 135, 0.52)');
      lampGrad.addColorStop(1, 'rgba(255, 226, 135, 0)');
      rctx.fillStyle = lampGrad;
      rctx.fillRect(340, 130, 380, 380);
    }
    rctx.restore();
    rctx.restore();

    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = false;

    const { scale, ox, oy } = getStageTransform(cw, ch);
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    ctx.drawImage(roomBuffer, 0, 0);

    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#E11D48';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    });

    ctx.restore();
  }

  function drawCenteredSprite(targetCtx, img, footX, footY, scale = 1) {
    const w = img.width * scale;
    const h = img.height * scale;
    targetCtx.drawImage(img, Math.round(footX - w / 2), Math.round(footY - h), Math.round(w), Math.round(h));
  }

  function loop() {
    updateSimulation();
    render();
    requestAnimationFrame(loop);
  }

  // =========================================================================
  // 6. INTERAKSI KLIK, TOUCH, HOVER & DRAG DECOR
  // =========================================================================
  const tooltip = document.getElementById('tooltip');
  let touchToastTimer = null;

  function showTooltipAt(text, clientX, clientY, autoHideMs = 0) {
    tooltip.textContent = text;
    const clampedX = Math.max(70, Math.min(window.innerWidth - 70, clientX));
    const clampedY = Math.max(60, clientY);
    tooltip.style.left = clampedX + 'px';
    tooltip.style.top = clampedY + 'px';
    tooltip.classList.add('show');
    if (touchToastTimer) clearTimeout(touchToastTimer);
    if (autoHideMs > 0) {
      touchToastTimer = setTimeout(() => tooltip.classList.remove('show'), autoHideMs);
    }
  }

  canvas.addEventListener('pointerdown', e => {
    // Tutup popover waktu jika tap di luar popover
    if (timePop.classList.contains('open')) {
      timePop.classList.remove('open');
    }

    const pt = screenToBase(e.clientX, e.clientY);
    const isTouch = e.pointerType === 'touch';
    const touchPad = isTouch ? 14 : 0;

    if (decorMode) {
      const keys = Object.keys(roomState.decors).reverse();
      for (const k of keys) {
        const d = roomState.decors[k];
        const spr = IMG[k];
        if (!spr) continue;
        if (Math.abs(pt.x - d.x) <= spr.width * 0.5 + touchPad &&
            pt.y >= d.y - spr.height - touchPad &&
            pt.y <= d.y + 12 + touchPad) {
          draggingKey = k;
          dragOffset = { x: pt.x - d.x, y: pt.y - d.y };
          if (isTouch) showTooltipAt(`Geser: ${d.label}`, e.clientX, e.clientY, 1200);
          playTone(440, 'sine', 0.06);
          return;
        }
      }
    }

    for (const m of mascots) {
      if (Math.abs(pt.x - m.x) < 34 + touchPad &&
          pt.y >= m.y - 80 - touchPad &&
          pt.y <= m.y + 10 + touchPad) {
        m.jumpVel = -5.5;
        spawnHeart(m.x, m.y - 60);
        if (isTouch) showTooltipAt(m.id === 'blue' ? 'Mochi Biru ♥' : 'Mochi Pink ♥', e.clientX, e.clientY, 1100);
        playTone(580, 'sine', 0.1, 880);
        pushState(true);
        return;
      }
    }

    const karpet = roomState.decors.karpet;
    const catX = karpet ? karpet.x + 6 : 364;
    const catY = karpet ? karpet.y + 3 : 511;
    if (Math.abs(pt.x - catX) < 42 + touchPad &&
        pt.y >= catY - 65 - touchPad &&
        pt.y <= catY + 12 + touchPad) {
      roomState.catMood = 'happy';
      roomState.catHappyUntil = Date.now() + 3500;
      spawnHeart(catX, catY - 45);
      if (isTouch) showTooltipAt('Mochi: Meow~ ♥', e.clientX, e.clientY, 1200);
      playMeow();
      return;
    }

    for (const z of HIT_ZONES) {
      if (pt.x >= z.x - touchPad && pt.x <= z.x + z.w + touchPad &&
          pt.y >= z.y - touchPad && pt.y <= z.y + z.h + touchPad) {
        if (z.id === 'curtain') {
          roomState.curtainOpen = !roomState.curtainOpen;
          if (isTouch) {
            showTooltipAt(roomState.curtainOpen ? 'Gorden Dibuka' : 'Gorden Ditutup', e.clientX, e.clientY, 1200);
          }
          playTone(roomState.curtainOpen ? 520 : 360, 'triangle', 0.12);
          pushState();
        } else {
          if (isTouch) showTooltipAt(z.label, e.clientX, e.clientY, 900);
          openPortal(z.id);
        }
        return;
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    const pt = screenToBase(e.clientX, e.clientY);

    if (draggingKey) {
      roomState.decors[draggingKey].x = Math.max(120, Math.min(600, Math.round(pt.x - dragOffset.x)));
      roomState.decors[draggingKey].y = Math.max(240, Math.min(620, Math.round(pt.y - dragOffset.y)));
      return;
    }

    if (e.pointerType === 'touch') return;

    let hoverText = '';
    if (decorMode) {
      for (const [k, d] of Object.entries(roomState.decors)) {
        const spr = IMG[k];
        if (spr && Math.abs(pt.x - d.x) <= spr.width * 0.5 && pt.y >= d.y - spr.height && pt.y <= d.y + 12) {
          hoverText = `Geser: ${d.label}`;
          break;
        }
      }
    } else {
      for (const z of HIT_ZONES) {
        if (pt.x >= z.x && pt.x <= z.x + z.w && pt.y >= z.y && pt.y <= z.y + z.h) {
          hoverText = z.label;
          break;
        }
      }
    }

    if (hoverText) {
      showTooltipAt(hoverText, e.clientX, e.clientY, 0);
    } else {
      tooltip.classList.remove('show');
    }
  });

  window.addEventListener('pointerup', () => {
    if (draggingKey) {
      draggingKey = null;
      pushState();
    }
  });

  // =========================================================================
  // 7. MODAL PORTAL 3D (KAPSUL WAKTU, PHOTOBOOTH, GAMES)
  // =========================================================================
  const modal = document.getElementById('portalModal');
  const urlInput = document.getElementById('portalUrlInput');
  const fullBtn = document.getElementById('portalFullBtn');
  const iframe = document.getElementById('portalIframe');

  function openPortal(key) {
    const info = PORTALS[key];
    if (!info) return;
    playTone(480, 'sine', 0.08, 720);
    urlInput.value = info.url;
    fullBtn.href = info.url;
    iframe.src = info.url;
    modal.classList.add('open');
  }

  function closePortal() {
    playTone(440, 'sine', 0.07, 300);
    modal.classList.remove('open');
    setTimeout(() => { iframe.src = 'about:blank'; }, 300);
  }

  document.querySelectorAll('[data-portal]').forEach(btn => {
    btn.addEventListener('click', () => openPortal(btn.dataset.portal));
  });
  document.getElementById('portalCloseBtn').addEventListener('click', closePortal);
  modal.addEventListener('click', e => { if (e.target === modal) closePortal(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closePortal();
  });
  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      let val = urlInput.value.trim();
      if (!/^https?:\/\//i.test(val)) val = 'https://' + val;
      iframe.src = val;
      fullBtn.href = val;
    }
  });

  // =========================================================================
  // 8. KONTROL HUD ATAS (WAKTU, LAMPU, DECOR, AUDIO, TEMA)
  // =========================================================================
  const clockText = document.getElementById('clockText');
  const timePop = document.getElementById('timePop');
  const timeSlider = document.getElementById('timeSlider');

  function updateClockDisplay() {
    if (manualHour === null) {
      const now = new Date();
      clockText.textContent = now.toTimeString().slice(0, 5);
    } else {
      clockText.textContent = String(manualHour).padStart(2, '0') + ':00';
    }
  }
  setInterval(updateClockDisplay, 1000);
  updateClockDisplay();

  clockText.addEventListener('click', e => {
    e.stopPropagation();
    timePop.classList.toggle('open');
  });
  timeSlider.addEventListener('input', () => {
    manualHour = parseInt(timeSlider.value, 10);
    updateClockDisplay();
  });
  document.querySelectorAll('[data-hr]').forEach(btn => {
    btn.addEventListener('click', () => {
      manualHour = parseInt(btn.dataset.hr, 10);
      timeSlider.value = manualHour;
      updateClockDisplay();
      document.querySelectorAll('[data-hr]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  document.getElementById('btnAutoTime').addEventListener('click', () => {
    manualHour = null;
    updateClockDisplay();
    timePop.classList.remove('open');
  });

  function updateUIButtons() {
    document.getElementById('btnLamp').classList.toggle('active', roomState.lampOn);
  }

  document.getElementById('btnLamp').addEventListener('click', () => {
    roomState.lampOn = !roomState.lampOn;
    updateUIButtons();
    playTone(roomState.lampOn ? 620 : 380, 'sine', 0.08);
    pushState();
  });

  const btnDecor = document.getElementById('btnDecor');
  const btnResetDecor = document.getElementById('btnResetDecor');
  btnDecor.addEventListener('click', () => {
    decorMode = !decorMode;
    btnDecor.classList.toggle('active', decorMode);
    btnResetDecor.style.display = decorMode ? 'inline-flex' : 'none';
    playTone(500, 'triangle', 0.07);
  });
  btnResetDecor.addEventListener('click', () => {
    roomState.decors = JSON.parse(JSON.stringify(DEFAULT_DECORS));
    pushState();
    playTone(420, 'triangle', 0.1);
  });

  document.getElementById('btnAudio').addEventListener('click', function() {
    audioEnabled = !audioEnabled;
    this.textContent = audioEnabled ? '🔊' : '🔇';
  });

  document.getElementById('btnTheme').addEventListener('click', function() {
    document.body.classList.toggle('dark');
    this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  });

  // Start!
  initFirebase();
  loadAllAssets(() => {
    updateUIButtons();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
