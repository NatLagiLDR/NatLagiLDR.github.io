<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>natlagildr.github.io — Cozy Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F3EC;
    --grid-line: rgba(122, 31, 36, 0.06);
    --grid-dot: rgba(122, 31, 36, 0.16);
    --pill-bg: rgba(255, 252, 247, 0.92);
    --pill-border: rgba(122, 31, 36, 0.14);
    --text: #2A211E;
    --muted: #7B6D68;
    --accent: #7A1F24;
    --shadow: 0 10px 28px rgba(42, 33, 30, 0.08);
  }
  body.dark {
    --bg: #191614;
    --grid-line: rgba(255, 235, 220, 0.04);
    --grid-dot: rgba(255, 235, 220, 0.11);
    --pill-bg: rgba(34, 29, 26, 0.92);
    --pill-border: rgba(255, 225, 210, 0.12);
    --text: #F4EDE4;
    --muted: #A4968E;
    --accent: #D6686E;
    --shadow: 0 12px 32px rgba(0, 0, 0, 0.42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background-color: var(--bg);
    background-image:
      radial-gradient(var(--grid-dot) 1.25px, transparent 1.25px),
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px, 32px 32px, 32px 32px;
    background-position: 16px 16px, 0 0, 0 0;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: background-color 0.35s ease, color 0.35s ease;
  }

  /* Minimal Floating Pills */
  .hud-top {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(14px, env(safe-area-inset-left));
    right: max(14px, env(safe-area-inset-right));
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .pill {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--pill-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 7px 14px;
    box-shadow: var(--shadow);
    font-size: 13px;
    font-weight: 600;
    max-width: 100%;
  }
  .brand-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .dom-short { display: none; }
  .dot-live {
    width: 8px; height: 8px; flex-shrink: 0; border-radius: 50%; background: #22C55E;
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
  }
  .role-chip {
    border: 1px solid var(--pill-border);
    background: rgba(122, 31, 36, 0.06);
    color: var(--text);
    border-radius: 999px;
    padding: 3px 9px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: 0.2s;
  }
  .role-chip:hover { background: rgba(122, 31, 36, 0.14); }
  .role-chip.blue { background: rgba(96, 165, 250, 0.18); border-color: rgba(96, 165, 250, 0.45); }
  .role-chip.pink { background: rgba(244, 114, 182, 0.18); border-color: rgba(244, 114, 182, 0.45); }

  .presence {
    display: inline-flex; align-items: center; gap: 4px;
    padding-left: 6px; border-left: 1px solid var(--pill-border);
    flex-shrink: 0;
  }
  .p-dot { width: 8px; height: 8px; border-radius: 50%; opacity: 0.3; transition: 0.3s; }
  .p-dot.blue { background: #60A5FA; }
  .p-dot.pink { background: #F472B6; }
  .p-dot.on { opacity: 1; transform: scale(1.15); }

  .icon-group { display: flex; align-items: center; gap: 3px; }
  .icon-btn {
    border: none; background: transparent; color: var(--text);
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    transition: background 0.2s, transform 0.15s;
  }
  .icon-btn:hover { background: rgba(122, 31, 36, 0.1); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn.active { background: var(--accent); color: #fff; }
  .clock-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    padding: 4px 6px; color: var(--muted); cursor: pointer;
    border-radius: 999px; white-space: nowrap;
  }
  .clock-badge:hover { background: rgba(122, 31, 36, 0.08); }

  /* Popovers (Role Picker & Time Picker) */
  .popover-card {
    position: fixed;
    top: calc(max(14px, env(safe-area-inset-top)) + 48px);
    z-index: 25;
    background: var(--pill-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--pill-border);
    border-radius: 18px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
    display: none; flex-direction: column; gap: 6px;
  }
  .popover-card.open { display: flex; }
  .role-pop { left: max(14px, env(safe-area-inset-left)); width: 195px; }
  .time-pop { right: max(14px, env(safe-area-inset-right)); width: 225px; }

  .role-opt {
    border: 1px solid var(--pill-border);
    background: transparent;
    color: var(--text);
    border-radius: 11px;
    padding: 7px 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: 0.15s;
  }
  .role-opt:hover { background: rgba(122, 31, 36, 0.08); }
  .role-opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .time-presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .t-btn {
    border: 1px solid var(--pill-border); background: transparent; color: var(--text);
    border-radius: 8px; padding: 6px 0; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .t-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Stage */
  #stage-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#roomCanvas {
    width: 100%; height: 100%;
    touch-action: none;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
  }

  /* Hover / Touch Tooltip */
  #tooltip {
    position: fixed; pointer-events: none; z-index: 30;
    background: var(--accent); color: #fff;
    padding: 5px 11px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    box-shadow: 0 6px 16px rgba(122, 31, 36, 0.28);
    transform: translate(-50%, -140%);
    opacity: 0; transition: opacity 0.16s ease;
    white-space: nowrap;
  }
  #tooltip.show { opacity: 1; }

  /* First-time Role Prompt Banner */
  .role-banner {
    position: fixed;
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 54px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 22;
    display: none;
    align-items: center;
    gap: 6px;
    background: var(--pill-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 6px 10px;
    box-shadow: var(--shadow);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .role-banner.show { display: inline-flex; }
  .rb-btn {
    border: 1px solid var(--pill-border);
    background: transparent;
    color: var(--text);
    border-radius: 999px;
    padding: 5px 10px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .rb-btn.blue { background: rgba(96, 165, 250, 0.22); border-color: rgba(96, 165, 250, 0.5); }
  .rb-btn.pink { background: rgba(244, 114, 182, 0.22); border-color: rgba(244, 114, 182, 0.5); }

  /* Couple Action Bar (Kiss, Peluk, Duduk Meja, Beanbag) */
  .couple-dock {
    position: fixed;
    bottom: calc(max(16px, env(safe-area-inset-bottom)) + 52px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: none;
    align-items: center;
    gap: 4px;
    max-width: calc(100vw - 20px);
    background: var(--pill-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 5px 7px;
    box-shadow: var(--shadow);
  }
  .couple-dock.show { display: inline-flex; }
  .act-btn {
    border: none;
    background: transparent;
    color: var(--text);
    padding: 6px 10px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    transition: 0.18s;
  }
  .act-btn:hover { background: rgba(122, 31, 36, 0.1); }
  .act-btn:active { transform: scale(0.94); }
  .act-btn.love { background: rgba(225, 29, 72, 0.12); color: #BE123C; }
  body.dark .act-btn.love { background: rgba(244, 114, 182, 0.18); color: #F9A8D4; }

  /* Bottom Portal Dock */
  .hud-bottom {
    position: fixed;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex; align-items: center; gap: 6px;
    max-width: calc(100vw - 24px);
    background: var(--pill-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--pill-border);
    border-radius: 999px;
    padding: 6px 8px;
    box-shadow: var(--shadow);
  }
  .dock-btn {
    border: none; background: transparent; color: var(--text);
    padding: 8px 14px; border-radius: 999px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12.5px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .dock-btn:hover { background: rgba(122, 31, 36, 0.09); }
  .dock-btn:active { transform: scale(0.95); }
  .dock-btn.primary { background: var(--accent); color: #fff; }
  .dock-btn.primary:hover { filter: brightness(1.08); }
  .divider { width: 1px; height: 18px; background: var(--pill-border); flex-shrink: 0; }

  /* 3D Unfold Portal Modal */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20, 16, 14, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    opacity: 0; pointer-events: none;
    perspective: 1400px; transition: opacity 0.28s ease;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: auto; }
  .modal-card {
    width: min(960px, 96vw);
    height: min(640px, 86dvh);
    background: var(--bg); border: 1px solid var(--pill-border);
    border-radius: 22px; overflow: hidden;
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.35);
    display: flex; flex-direction: column;
    transform-origin: center bottom;
    transform: rotateX(18deg) scale(0.92) translateY(24px);
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .modal-backdrop.open .modal-card {
    transform: rotateX(0deg) scale(1) translateY(0);
  }
  .modal-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 14px; background: var(--pill-bg);
    border-bottom: 1px solid var(--pill-border);
  }
  .url-box {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
    background: rgba(122, 31, 36, 0.06); border: 1px solid var(--pill-border);
    border-radius: 999px; padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
  }
  .url-box input {
    flex: 1; min-width: 0; border: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 12px; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .modal-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .m-btn {
    border: 1px solid var(--pill-border); background: transparent; color: var(--text);
    padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
    cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  .m-btn.close { background: var(--accent); color: #fff; border-color: var(--accent); }
  .modal-frame-wrap { position: relative; flex: 1; background: #fff; -webkit-overflow-scrolling: touch; }
  .modal-frame-wrap iframe { width: 100%; height: 100%; border: none; }

  /* Responsive Mobile & Tablet Breakpoints */
  @media (max-width: 640px) {
    .hud-top {
      top: max(10px, env(safe-area-inset-top));
      left: 10px;
      right: 10px;
    }
    .pill { padding: 6px 10px; gap: 6px; font-size: 12px; }
    .brand-title { font-size: 13.5px; }
    .presence { padding-left: 5px; gap: 3px; }
    .icon-group { gap: 1px; }
    .icon-btn { width: 28px; height: 28px; font-size: 13px; }
    .clock-badge { font-size: 11px; padding: 3px 5px; }
    .popover-card { top: calc(max(10px, env(safe-area-inset-top)) + 44px); }
    .role-pop { left: 10px; }
    .time-pop { right: 10px; }
    .hud-bottom {
      bottom: max(12px, env(safe-area-inset-bottom));
      padding: 5px 6px;
      gap: 4px;
    }
    .couple-dock, .role-banner {
      bottom: calc(max(12px, env(safe-area-inset-bottom)) + 48px);
    }
    .dock-btn { padding: 7px 11px; font-size: 12px; gap: 5px; }
    .act-btn { padding: 6px 8px; font-size: 11px; gap: 3px; }
    .modal-card { width: 96vw; height: 88dvh; border-radius: 18px; }
    .modal-bar { padding: 8px 10px; gap: 6px; }
    .m-btn { padding: 6px 10px; font-size: 11.5px; }
  }

  @media (max-width: 440px) {
    .dom-full { display: none; }
    .dom-short { display: inline; }
    .full-label-extra { display: none; }
    .dock-btn { padding: 7px 9px; font-size: 11.5px; }
    .role-chip { padding: 2px 7px; font-size: 11px; }
  }
</style>
</head>

</div>

<div id="stage-wrap">
  <canvas id="roomCanvas"></canvas>
</div>
<div id="tooltip"></div>

<!-- Quick First-Visit Role Selector -->
<div class="role-banner" id="roleBanner">
  <span>Pilih:</span>
  <button class="rb-btn blue" data-set-role="blue">💙 Cowo</button>
  <button class="rb-btn pink" data-set-role="pink">🩷 Cewe</button>
</div>

<!-- Couple Interaction Bar (Muncul saat Cowo atau Cewe dipilih) -->
<div class="couple-dock" id="coupleDock">

<!-- 3D Portal Modal -->
<div class="modal-backdrop" id="portalModal">
  <div class="modal-card">

  let audioEnabled = true;

  function playTone(freq, type = 'triangle', dur = 0.09, slideTo = null) {
    if (!audioEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

    { x: 418, y: 442 }, // 2: Tengah ruangan (kanan kasur)

  const WALK_EDGES = {
    0: [1, 2],
    1: [0, 2],
    2: [0, 1, 3],
    3: [2, 4],
    4: [3, 5],
    5: [4, 6],
    6: [5]
  };

  function findNodePath(startIdx, endIdx) {
    if (startIdx === endIdx) return [endIdx];
    const queue = [[startIdx]];
    const visited = new Set([startIdx]);
    while (queue.length > 0) {
      const path = queue.shift();
      const curr = path[path.length - 1];
      for (const nxt of (WALK_EDGES[curr] || [])) {
        if (nxt === endIdx) return [...path, nxt];
        if (!visited.has(nxt)) {
          visited.add(nxt);
          queue.push([...path, nxt]);
        }
      }
    }
    return [endIdx];
  }

  function nearestNode(x, y) {
    let best = 2, bestD = Infinity;
    WALK_NODES.forEach((n, idx) => {
      const d = Math.hypot(n.x - x, n.y - y);
      if (d < bestD) { bestD = d; best = idx; }
    });
    return best;
  }

  function getServerClockParts() {

    const d = new Date(serverMs + 8 * 3600 * 1000);

  function commandMascotToActivity(m, actName) {
    const spot = getActivitySpot(actName, m.id);
    if (!spot) return;

    if (m.inBed) {
      const exitNode = m.id === 'blue' ? 2 : 5;
      m.x = WALK_NODES[exitNode].x;
      m.y = WALK_NODES[exitNode].y;
      m.currentNode = exitNode;
      m.inBed = false;
    }

    m.activity = 'walking';
    m.activityTimer = 0;
    m.pendingActivity = { name: actName, spot };
    const startNode = nearestNode(m.x, m.y);
    m.currentNode = startNode;
    m.pathQueue = findNodePath(startNode, spot.node).slice(1);
    m.finalDest = { x: spot.x, y: spot.y, facing: spot.facing };
    if (myRole === m.id) pushMyCharState(true);
  }

  function commandMascotToFloor(m, targetX, targetY, destFacing = null) {
    if (m.inBed) {
      const exitNode = m.id === 'blue' ? 2 : 5;
      m.x = WALK_NODES[exitNode].x;
      m.y = WALK_NODES[exitNode].y;
      m.currentNode = exitNode;
      m.inBed = false;
    }
    m.activity = 'walking';
    m.activityTimer = 0;
    m.pendingActivity = null;
    const startNode = nearestNode(m.x, m.y);
    const endNode = nearestNode(targetX, targetY);
    m.currentNode = startNode;
    m.pathQueue = findNodePath(startNode, endNode).slice(1);

  // Memulai interaksi couple: Kiss atau Peluk (sinkron di kedua device!)
  function startCoupleAction(type, initiatorId, broadcast = true, forcedMeetX = null, forcedMeetY = null) {
    const actor = getMascot(initiatorId) || mascots[0];

  function getStageTransform(cw, ch) {
    const isMobile = cw < 640;
    const fillRatio = isMobile ? 0.98 : 0.94;
    const scale = Math.min(cw / BASE_W, ch / BASE_H) * fillRatio;
    const ox = (cw - BASE_W * scale) / 2;
    const oy = (ch - BASE_H * scale) / 2 - (isMobile && ch > cw ? 14 : 0);
    return { scale, ox, oy };
  }

  function screenToBase(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const { scale, ox, oy } = getStageTransform(rect.width, rect.height);
    return {
      x: (clientX - rect.left - ox) / scale,
      y: (clientY - rect.top - oy) / scale
    };
  }

  function updateSimulation() {
    const sleeping = isSleepTime();

    if (roomState.catMood === 'happy' && Date.now() > roomState.catHappyUntil) {

        if (Date.now() > coupleAnim.until) {
          actor.activity = 'idle';
          partner.activity = 'idle';
          actor.waitTimer = 50;
          partner.waitTimer = 60;
          coupleAnim = null;
          if (myRole !== 'auto') pushMyCharState(true);
        }
      }
    }

    // Update masing-masing maskot
    mascots.forEach(m => {
      if (m.jumpY < 0 || m.jumpVel !== 0) {
        m.jumpY += m.jumpVel;
        m.jumpVel += 0.45;
        if (m.jumpY >= 0) {
          m.jumpY = 0;
          m.jumpVel = 0;
        }
      }

      // Sedang dalam animasi couple (moving / acting) -> dikendalikan oleh coupleAnim
      if (coupleAnim) {
        if (coupleAnim.phase === 'moving') {
          stepMascotMovement(m);
        } else {
          m.frame = 0;
        }
        return;
      }

      const isControlledByMe = (myRole === m.id);
      const claimedRemotely = isRoleClaimedRemotely(m.id);
      const hasFreshRemote = !isControlledByMe && m.remoteTarget &&
        (claimedRemotely || (Date.now() - m.remoteTarget.localReceivedAt < 25000));

      // Jika dikontrol pasangan dari perangkat jauh (Firebase): ikuti 100% tanpa pernah jatuh ke AI acak!
      if (hasFreshRemote) {
        const rt = m.remoteTarget;
        const dx = rt.x - m.x;
        const dy = rt.y - m.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 2) {
          m.x += dx * 0.16;
          m.y += dy * 0.16;
          if (Math.abs(dx) > 0.25) m.facing = dx < 0 ? -1 : 1;
          m.stepTimer++;
          if (m.stepTimer % 10 === 0) m.frame = m.frame === 1 ? 2 : 1;
        } else {
          m.x = rt.x;
          m.y = rt.y;
          m.facing = rt.facing;
          m.frame = 0;
        }
        m.activity = rt.activity;
        m.inBed = rt.inBed;
        m.pathQueue = [];
        m.finalDest = null;
        return;
      }

      // Tidur malam otomatis (hanya untuk karakter yang tidak sedang dikontrol user)
      if (sleeping && !isControlledByMe) {
        if (!m.inBed) {
          const bedsideNode = m.id === 'blue' ? 2 : 5;
          if (m.currentNode !== bedsideNode && m.pathQueue.length === 0) {
            m.pathQueue = findNodePath(m.currentNode, bedsideNode).slice(1);
          }
          if (m.pathQueue.length > 0) {
            stepMascotMovement(m);
            return;
          }
          m.inBed = true;
          m.activity = 'bed';
        }
        m.x += (m.bedX - m.x) * 0.12;
        m.y += (m.bedY - m.y) * 0.12;
        m.frame = 0;
        return;
      }

      // Bangun pagi otomatis
      if (!sleeping && m.inBed && m.activity !== 'bed' && !isControlledByMe) {
        const exitNode = m.id === 'blue' ? 2 : 5;
        const exitPt = WALK_NODES[exitNode];
        m.x = exitPt.x;
        m.y = exitPt.y;
        m.currentNode = exitNode;
        m.inBed = false;
        m.activity = 'idle';
        m.waitTimer = 25;
      }

      // Jalankan pathfinding & finalDest
      if (m.pathQueue.length > 0 || m.finalDest) {
        stepMascotMovement(m);
        if (isControlledByMe) pushMyCharState(false);
        return;
      }

      // Jika dikontrol oleh saya: tetap diam di posisi / pose duduk sekarang sampai saya klik tempat lain
      if (isControlledByMe) {
        m.frame = 0;
        return;
      }

      // Sedang menjalankan aktivitas otonom (duduk/santai)
      if (m.activityTimer > 0) {
        m.activityTimer--;
        m.frame = 0;
        if (m.activityTimer === 0) {
          if (m.inBed) {
            const exitNode = m.id === 'blue' ? 2 : 5;
            m.x = WALK_NODES[exitNode].x;
            m.y = WALK_NODES[exitNode].y;
            m.currentNode = exitNode;
            m.inBed = false;
          }
          m.activity = 'idle';
          m.waitTimer = 35;
        }
        return;
      }

      // AI otonom (hanya berjalan jika karakter TIDAK dikontrol lokal maupun remote)
      if (m.waitTimer > 0) {
        m.waitTimer--;
        m.frame = 0;
        if (m.waitTimer === 0) {
          const roll = Math.random();
          if (roll < 0.65) {
            const acts = ['desk', 'beanbag', 'board', 'cat', 'camera'];
            const other = getMascot(m.id === 'blue' ? 'pink' : 'blue');
            const filtered = acts.filter(a => !(other && other.activity === a && (a === 'desk' || a === 'beanbag')));
            const chosen = filtered[Math.floor(Math.random() * filtered.length)];
            commandMascotToActivity(m, chosen);
          } else {
            let targetNode = Math.floor(Math.random() * WALK_NODES.length);
            if (targetNode === m.currentNode) {
              targetNode = (m.currentNode + 2) % WALK_NODES.length;
            }
            m.pathQueue = findNodePath(m.currentNode, targetNode).slice(1);
            m.activity = 'walking';
          }
        }
      }
    });

    particles.forEach(p => {
      p.y += p.vy;
      p.alpha -= 0.014;
    });
    particles = particles.filter(p => p.alpha > 0);
  }

  function stepMascotMovement(m) {
    let target = null;
    let isWaypoint = false;

    if (m.pathQueue.length > 0) {
      target = WALK_NODES[m.pathQueue[0]];
      isWaypoint = true;
    } else if (m.finalDest) {
      target = m.finalDest;
    }

    if (!target) {
      m.frame = 0;
      return;
    }

    const dx = target.x - m.x;
    const dy = target.y - m.y;
    const dist = Math.hypot(dx, dy);

    if (Math.abs(dx) > 0.15) {
      m.facing = dx < 0 ? -1 : 1;
    }

    if (dist <= m.speed * 1.4) {
      m.x = target.x;
      m.y = target.y;
      if (isWaypoint) {
        m.currentNode = m.pathQueue.shift();
      } else {
        if (m.finalDest && m.finalDest.facing) {
          m.facing = m.finalDest.facing;
        }
        m.finalDest = null;
      }

      if (m.pathQueue.length === 0 && !m.finalDest) {
        m.frame = 0;
        if (m.pendingActivity) {
          m.activity = m.pendingActivity.name;
          m.activityTimer = (myRole === m.id) ? 0 : m.pendingActivity.spot.duration;
          if (m.activity === 'bed') m.inBed = true;
          m.pendingActivity = null;
        } else if (m.activity === 'walking') {
          m.activity = 'idle';
          m.waitTimer = 60 + Math.floor(Math.random() * 80);
        }
        if (myRole === m.id) pushMyCharState(true);
      }
    } else {
      m.x += (dx / dist) * m.speed;
      m.y += (dy / dist) * m.speed;
      m.stepTimer++;
      if (m.stepTimer % 11 === 0) {
        m.frame = m.frame === 1 ? 2 : 1;
      }
    }
  }

  function render() {
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    if (canvas.width !== cw * dpr || canvas.height !== ch * dpr) {
      canvas.width = cw * dpr;
      canvas.height = ch * dpr;
    }

    rctx.save();
    rctx.clearRect(0, 0, BASE_W, BASE_H);
    rctx.imageSmoothingEnabled = false;

    if (IMG.kamar_base) {
      rctx.drawImage(IMG.kamar_base, 10, 10);
    }

    const hr = getActiveHour();
    const isNight = (hr >= 19 || hr < 6);

    // Langit malam & bintang di kaca jendela
    if (isNight) {
      rctx.save();
      rctx.beginPath();
      rctx.moveTo(219, 154);
      rctx.lineTo(298, 109);
      rctx.lineTo(298, 209);
      rctx.lineTo(219, 254);
      rctx.closePath();
      rctx.fillStyle = 'rgba(18, 26, 62, 0.78)';
      rctx.fill();

      const twinkle = 0.55 + 0.45 * Math.sin(Date.now() / 420);
      rctx.fillStyle = `rgba(255, 248, 200, ${twinkle.toFixed(2)})`;
      rctx.fillRect(242, 165, 3, 3);
      rctx.fillRect(276, 138, 2, 2);
      rctx.fillRect(265, 185, 2, 2);
      rctx.fillRect(234, 212, 3, 3);
      rctx.restore();
    }

    // Cahaya matahari pagi/siang
    if (roomState.curtainOpen && hr >= 6 && hr <= 17) {
      rctx.save();
      const grad = rctx.createLinearGradient(230, 130, 420, 460);
      grad.addColorStop(0, 'rgba(255, 244, 195, 0.34)');
      grad.addColorStop(1, 'rgba(255, 244, 195, 0.0)');
      rctx.fillStyle = grad;
      rctx.beginPath();
      rctx.moveTo(215, 130);
      rctx.lineTo(315, 82);
      rctx.lineTo(485, 380);
      rctx.lineTo(335, 455);
      rctx.closePath();
      rctx.fill();
      rctx.restore();
    }

    // Gorden Pink
    const curtainImg = roomState.curtainOpen ? IMG.gorden_buka : IMG.gorden_tutup;
    if (curtainImg) {
      rctx.save();
      rctx.translate(195, 141);
      rctx.transform(1, -0.436, 0, 1, 0, 0);
      rctx.drawImage(curtainImg, 0, 0, 135, 144);
      rctx.restore();
    }

    // Karpet
    const karpet = roomState.decors.karpet;
    if (IMG.karpet && karpet) {
      drawCenteredSprite(rctx, IMG.karpet, karpet.x, karpet.y, 1.15, false);
    }

    // Target indicator di lantai saat user tap tujuan jalan
    if (moveIndicator && Date.now() < moveIndicator.until) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 120);
      rctx.save();
      rctx.strokeStyle = `rgba(122, 31, 36, ${(0.35 + pulse * 0.4).toFixed(2)})`;
      rctx.lineWidth = 2;
      rctx.beginPath();
      rctx.ellipse(moveIndicator.x, moveIndicator.y - 2, 12 + pulse * 4, 5 + pulse * 2, 0, 0, Math.PI * 2);
      rctx.stroke();
      rctx.restore();
    }

    // Layar laptop menyala saat ada karakter duduk di kursi meja belajar
    const someoneAtDesk = mascots.some(m => m.activity === 'desk');
    if (someoneAtDesk) {
      rctx.save();
      const glow = 0.25 + 0.12 * Math.sin(Date.now() / 220);
      rctx.fillStyle = `rgba(147, 197, 253, ${glow.toFixed(2)})`;
      rctx.beginPath();
      rctx.ellipse(518, 305, 28, 18, -0.3, 0, Math.PI * 2);
      rctx.fill();
      rctx.restore();
    }

    // Kumpulan Objek Ber-Y-Sort
    const drawList = [];

    Object.entries(roomState.decors).forEach(([key, d]) => {
      if (key === 'karpet') return;
      const spr = IMG[key];
      if (spr) {
        drawList.push({
          y: d.y,
          draw: () => {
            drawCenteredSprite(rctx, spr, d.x, d.y, 0.90, false);
            if (decorMode) {
              rctx.save();
              rctx.strokeStyle = '#7A1F24';
              rctx.setLineDash([4, 3]);
              rctx.lineWidth = 1.5;
              rctx.strokeRect(d.x - spr.width * 0.45, d.y - spr.height * 0.85, spr.width * 0.90, spr.height * 0.88);
              rctx.restore();
            }
          }
        });
      }
    });

    // Kucing Mochi
    const catX = karpet ? karpet.x + 6 : 364;
    const catY = karpet ? karpet.y + 3 : 511;
    const catKey = roomState.catMood === 'happy' ? 'kucing_senang'
                 : roomState.catMood === 'sit'   ? 'kucing_duduk' : 'kucing_tidur';
    if (IMG[catKey]) {
      const breathe = roomState.catMood === 'sleep' ? Math.sin(Date.now() / 550) * 1.1 : 0;
      drawList.push({
        y: catY,
        draw: () => drawCenteredSprite(rctx, IMG[catKey], catX, catY + breathe, 0.72, false)
      });
    }

    // Cek apakah sedang dalam animasi spesial couple (Kiss / Peluk)
    const isActingCouple = coupleAnim && coupleAnim.phase === 'acting';
    let coupleSpriteKey = null;
    if (isActingCouple) {
      const elapsed = Date.now() - (coupleAnim.startedAt || Date.now());
      if (coupleAnim.type === 'hug') {
        coupleSpriteKey = Math.floor(elapsed / 280) % 2 === 0 ? 'couple_hug1' : 'couple_hug2';
      } else {
        if (elapsed < 650) {
          coupleSpriteKey = 'couple_kiss1';
        } else {
          coupleSpriteKey = Math.floor(elapsed / 260) % 2 === 0 ? 'couple_kiss2' : 'couple_kiss1';
        }
      }
    }

    if (isActingCouple && IMG[coupleSpriteKey]) {
      const b = getMascot('blue');
      const p = getMascot('pink');
      const midX = (b.x + p.x) / 2;
      const midY = Math.max(b.y, p.y);
      const cSpr = IMG[coupleSpriteKey];
      drawList.push({
        y: midY,
        draw: () => {
          rctx.save();
          rctx.fillStyle = 'rgba(42, 33, 30, 0.20)';
          rctx.beginPath();
          rctx.ellipse(midX, midY - 2, 32, 9, 0, 0, Math.PI * 2);
          rctx.fill();
          rctx.restore();

          const jumpOffset = Math.min(b.jumpY, p.jumpY);
          drawCenteredSprite(rctx, cSpr, midX, midY + jumpOffset, 0.80, false);
        }
      });
    } else {
      // Maskot Biru & Pink individual
      mascots.forEach(m => {
        const isSleepingPose = m.inBed;
        const isSittingPose = !isSleepingPose && (m.activity === 'desk' || m.activity === 'beanbag') && IMG[`${m.prefix}_duduk`];
        const key = isSleepingPose
          ? `${m.prefix}_tidur`
          : isSittingPose
          ? `${m.prefix}_duduk`
          : m.frame === 1 ? `${m.prefix}_jalan1`
          : m.frame === 2 ? `${m.prefix}_jalan2` : `${m.prefix}_diam`;
        const spr = IMG[key];
        if (spr) {
          drawList.push({
            y: m.y,
            draw: () => {
              // Bayangan bawah kaki (hanya saat berdiri/jalan di lantai)
              if (!isSleepingPose && !isSittingPose) {
                rctx.save();
                rctx.fillStyle = 'rgba(42, 33, 30, 0.18)';
                rctx.beginPath();
                rctx.ellipse(m.x, m.y - 2, 16, 6, 0, 0, Math.PI * 2);
                rctx.fill();
                rctx.restore();
              }

              // Offset vertikal agar pas duduk di atas bantal beanbag / stool meja
              const seatLift = m.activity === 'beanbag' ? -14 : (m.activity === 'desk' ? -5 : 0);
              let bobY = (!isSleepingPose && !isSittingPose && m.frame > 0) ? -3 : 0;
              if (m.activity === 'desk') {
                bobY = Math.sin(Date.now() / 160) * 1.1;
              } else if (m.activity === 'beanbag') {
                bobY = Math.sin(Date.now() / 340) * 1.0;
              }

              const flipX = !isSleepingPose && (m.facing === -1);
              drawCenteredSprite(
                rctx,
                spr,
                m.x,
                m.y + seatLift + m.jumpY + bobY,
                isSleepingPose ? 0.74 : 0.78,
                flipX
              );

              // Indikator karakter yang sedang kamu kontrol
              if (myRole === m.id && !isSleepingPose) {
                const arrowBob = Math.sin(Date.now() / 280) * 2.5;
                rctx.save();
                rctx.fillStyle = m.id === 'blue' ? '#3B82F6' : '#EC4899';
                rctx.beginPath();
                const ay = m.y + seatLift - (isSittingPose ? 74 : 92) + m.jumpY + arrowBob;
                rctx.moveTo(m.x, ay + 6);
                rctx.lineTo(m.x - 5, ay);
                rctx.lineTo(m.x + 5, ay);
                rctx.closePath();
                rctx.fill();
                rctx.restore();
              }

              // Gelembung ikon aktivitas kecil
              const actIcons = { desk: '💻', beanbag: '♪', board: '💌', cat: '🐾', camera: '📸' };
              if (actIcons[m.activity]) {
                const floatY = Math.sin(Date.now() / 360) * 2;
                rctx.save();
                rctx.font = '13px sans-serif';
                rctx.fillText(actIcons[m.activity], m.x + 14, m.y + seatLift - (isSittingPose ? 54 : 68) + floatY);
                rctx.restore();
              }
            }
          });
        }
      });
    }

    drawList.sort((a, b) => a.y - b.y);
    drawList.forEach(item => item.draw());

    // Pencahayaan Sore / Malam di dalam siluet kamar
    rctx.save();
    rctx.globalCompositeOperation = 'source-atop';
    if (hr >= 17 && hr <= 18) {
      rctx.fillStyle = 'rgba(235, 118, 60, 0.16)';
      rctx.fillRect(0, 0, BASE_W, BASE_H);
    } else if (isNight) {
      rctx.fillStyle = roomState.lampOn ? 'rgba(18, 22, 52, 0.28)' : 'rgba(14, 18, 46, 0.44)';
      rctx.fillRect(0, 0, BASE_W, BASE_H);
    }

    if (roomState.lampOn) {
      const lampGrad = rctx.createRadialGradient(575, 295, 8, 560, 325, 185);
      lampGrad.addColorStop(0, 'rgba(255, 226, 135, 0.52)');
      lampGrad.addColorStop(1, 'rgba(255, 226, 135, 0)');
      rctx.fillStyle = lampGrad;
      rctx.fillRect(340, 130, 380, 380);
    }
    rctx.restore();
    rctx.restore();

    // Gambar ke kanvas utama
    ctx.save();
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = false;

    const { scale, ox, oy } = getStageTransform(cw, ch);
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    ctx.drawImage(roomBuffer, 0, 0);

    // Partikel Hati / Kiss / Hug
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.font = 'bold 17px sans-serif';
      ctx.fillStyle = '#E11D48';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    });

    ctx.restore();
  }

  function drawCenteredSprite(targetCtx, img, footX, footY, scale = 1, flipX = false) {
    const w = Math.round(img.width * scale);
    const h = Math.round(img.height * scale);
    const dx = Math.round(footX);
    const dy = Math.round(footY);
    if (flipX) {
      targetCtx.save();
      targetCtx.translate(dx, dy);
      targetCtx.scale(-1, 1);
      targetCtx.drawImage(img, -Math.round(w / 2), -h, w, h);
      targetCtx.restore();
    } else {
      targetCtx.drawImage(img, dx - Math.round(w / 2), dy - h, w, h);
    }
  }

  function loop() {
    updateSimulation();
    render();
    requestAnimationFrame(loop);
  }

  // =========================================================================
  // 6. INTERAKSI KLIK, TOUCH, KONTROL LANTAI & DRAG DECOR
  // =========================================================================
  const tooltip = document.getElementById('tooltip');
  let touchToastTimer = null;

  function showTooltipAt(text, clientX, clientY, autoHideMs = 0) {
    tooltip.textContent = text;
    const clampedX = Math.max(85, Math.min(window.innerWidth - 85, clientX));
    const clampedY = Math.max(60, clientY);
    tooltip.style.left = clampedX + 'px';
    tooltip.style.top = clampedY + 'px';
    tooltip.classList.add('show');
    if (touchToastTimer) clearTimeout(touchToastTimer);
    if (autoHideMs > 0) {
      touchToastTimer = setTimeout(() => tooltip.classList.remove('show'), autoHideMs);
    }
  }

  function showCenterToast(text, duration = 2200) {
    showTooltipAt(text, window.innerWidth / 2, Math.max(115, window.innerHeight * 0.22), duration);
  }

  function isWalkableFloor(px, py) {
    if (px < 165 || px > 475 || py < 315 || py > 610) return false;
    if (px < 372 && py < 468) return false;
    if (px < 260 && py < 535) return false;
    if (px > 445 && py < 430) return false;
    if (px > 460 && py > 440) return false;
    return true;
  }

  canvas.addEventListener('pointerdown', e => {
    timePop.classList.remove('open');
    rolePop.classList.remove('open');

    const pt = screenToBase(e.clientX, e.clientY);
    const isTouch = e.pointerType === 'touch';
    const touchPad = isTouch ? 12 : 0;

    if (decorMode) {
      const keys = Object.keys(roomState.decors).reverse();
      for (const k of keys) {
        const d = roomState.decors[k];
        const spr = IMG[k];
        if (!spr) continue;
        if (Math.abs(pt.x - d.x) <= spr.width * 0.5 + touchPad &&
            pt.y >= d.y - spr.height - touchPad &&
            pt.y <= d.y + 12 + touchPad) {
          draggingKey = k;
          dragOffset = { x: pt.x - d.x, y: pt.y - d.y };
          if (isTouch) showTooltipAt(`Geser: ${d.label}`, e.clientX, e.clientY, 1200);
          playTone(440, 'sine', 0.06);
          return;
        }
      }
    }

    // 1. Cek klik Maskot Biru / Pink (hanya jika tidak sedang duduk di atas beanbag)
    for (const m of mascots) {
      if (Math.abs(pt.x - m.x) < 28 + touchPad &&
          pt.y >= m.y - 78 - touchPad &&
          pt.y <= m.y + 8 + touchPad) {
        m.jumpVel = -5.5;
        spawnParticles(m.x, m.y - 60, '♥', 4);
        if (isTouch) showTooltipAt(m.id === 'blue' ? 'Mochi Biru ♥' : 'Mochi Pink ♥', e.clientX, e.clientY, 1100);
        playTone(580, 'sine', 0.1, 880);
        pushState({
          pingEvent: {
            id: sessionId + '_' + Date.now(),
            by: sessionId,
            targetId: m.id
          }
        });
        return;
      }
    }

    // 2. Cek klik Kucing Mochi
    const karpet = roomState.decors.karpet;
    const catX = karpet ? karpet.x + 6 : 364;
    const catY = karpet ? karpet.y + 3 : 511;
    if (Math.abs(pt.x - catX) < 38 + touchPad &&
        pt.y >= catY - 58 - touchPad &&
        pt.y <= catY + 12 + touchPad) {
      roomState.catMood = 'happy';
      roomState.catHappyUntil = Date.now() + 3500;
      spawnParticles(catX, catY - 45, '♥', 4);
      if (myRole !== 'auto') {
        const me = getMascot(myRole);
        if (me) commandMascotToActivity(me, 'cat');
      }
      if (isTouch) showTooltipAt('Mochi: Meow~ ♥', e.clientX, e.clientY, 1200);
      playMeow();
      pushState({
        catEvent: {
          id: sessionId + '_' + Date.now(),
          by: sessionId
        }
      });
      return;
    }

    // 3. Cek klik zona objek portal / gorden
    for (const z of HIT_ZONES) {
      if (pt.x >= z.x && pt.x <= z.x + z.w && pt.y >= z.y && pt.y <= z.y + z.h) {
        if (z.id === 'curtain') {
          roomState.curtainOpen = !roomState.curtainOpen;
          if (isTouch) {
            showTooltipAt(roomState.curtainOpen ? 'Gorden Dibuka' : 'Gorden Ditutup', e.clientX, e.clientY, 1200);
          }
          playTone(roomState.curtainOpen ? 520 : 360, 'triangle', 0.12);
          pushState();
        } else {
          if (isTouch) showTooltipAt(z.label, e.clientX, e.clientY, 900);
          openPortal(z.id);
        }
        return;
      }
    }

    // 4. Jika user sedang mengontrol karakter (Cowo / Cewe): tap beanbag, kursi meja, kasur, atau lantai!
    if (myRole !== 'auto') {
      const me = getMascot(myRole);
      if (!me) return;

      // Tap beanbag -> duduk santai di beanbag!
      const bb = roomState.decors.beanbag;
      if (bb && Math.abs(pt.x - bb.x) <= 44 && Math.abs(pt.y - (bb.y - 32)) <= 44) {
        commandMascotToActivity(me, 'beanbag');
        moveIndicator = { x: bb.x + 2, y: bb.y + 4, until: Date.now() + 1200 };
        if (isTouch) showTooltipAt('🛋️ Duduk di Beanbag', e.clientX, e.clientY, 1000);
        playTone(540, 'sine', 0.07);
        return;
      }

      // Tap kursi / meja belajar bawah -> duduk di kursi meja!
      if (pt.x >= 460 && pt.x <= 585 && pt.y >= 345 && pt.y <= 435) {
        commandMascotToActivity(me, 'desk');
        moveIndicator = { x: 495, y: 396, until: Date.now() + 1200 };
        if (isTouch) showTooltipAt('🪑 Duduk di Kursi Meja', e.clientX, e.clientY, 1000);
        playTone(520, 'sine', 0.07);
        return;
      }

      // Tap kasur -> naik tidur di kasur!
      if (pt.x >= 85 && pt.x <= 345 && pt.y >= 295 && pt.y <= 475) {
        commandMascotToActivity(me, 'bed');
        moveIndicator = { x: me.bedX, y: me.bedY, until: Date.now() + 1200 };
        if (isTouch) showTooltipAt('💤 Tiduran di Kasur', e.clientX, e.clientY, 1000);
        playTone(420, 'sine', 0.08);
        return;
      }

      // Tap area lantai kayu terbuka -> jalan ke titik tersebut!
      if (isWalkableFloor(pt.x, pt.y)) {
        commandMascotToFloor(me, Math.round(pt.x), Math.round(pt.y));
        moveIndicator = { x: pt.x, y: pt.y, until: Date.now() + 1100 };
        playTone(480, 'sine', 0.05);
        return;
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    const pt = screenToBase(e.clientX, e.clientY);

    if (draggingKey) {
      roomState.decors[draggingKey].x = Math.max(120, Math.min(600, Math.round(pt.x - dragOffset.x)));
      roomState.decors[draggingKey].y = Math.max(240, Math.min(620, Math.round(pt.y - dragOffset.y)));
      return;
    }

    if (e.pointerType === 'touch') return;

    let hoverText = '';
    if (decorMode) {
      for (const [k, d] of Object.entries(roomState.decors)) {
        const spr = IMG[k];
        if (spr && Math.abs(pt.x - d.x) <= spr.width * 0.5 && pt.y >= d.y - spr.height && pt.y <= d.y + 12) {
          hoverText = `Geser: ${d.label}`;
          break;
        }
      }
    } else {
      for (const z of HIT_ZONES) {
        if (pt.x >= z.x && pt.x <= z.x + z.w && pt.y >= z.y && pt.y <= z.y + z.h) {
          hoverText = z.label;
          break;
        }
      }
      if (!hoverText && myRole !== 'auto') {
        const bb = roomState.decors.beanbag;
        if (bb && Math.abs(pt.x - bb.x) <= 44 && Math.abs(pt.y - (bb.y - 32)) <= 44) {
          hoverText = '🛋️ Duduk di Beanbag';
        } else if (pt.x >= 460 && pt.x <= 585 && pt.y >= 345 && pt.y <= 435) {
          hoverText = '🪑 Duduk di Kursi Meja';
        } else if (pt.x >= 85 && pt.x <= 345 && pt.y >= 295 && pt.y <= 475) {
          hoverText = '💤 Tiduran di Kasur';
        }
      }
    }

    if (hoverText) {
      showTooltipAt(hoverText, e.clientX, e.clientY, 0);
    } else {
      tooltip.classList.remove('show');
    }
  });

  window.addEventListener('pointerup', () => {
    if (draggingKey) {
      draggingKey = null;
      pushState();
      if (myRole !== 'auto') {
        const me = getMascot(myRole);
        if (me && me.activity === 'beanbag') {
          const spot = getActivitySpot('beanbag', me.id);
          me.x = spot.x;
          me.y = spot.y;
          pushMyCharState(true);
        }
      }
    }
  });

  // =========================================================================
  // 7. KONTROL PILIHAN KARAKTER (COWO / CEWE) & AKSI KISS / PELUK / DUDUK
  // =========================================================================
  const roleChipBtn = document.getElementById('roleChipBtn');
  const rolePop = document.getElementById('rolePop');
  const roleBanner = document.getElementById('roleBanner');
  const coupleDock = document.getElementById('coupleDock');

  function applyRoleUI() {
    roleChipBtn.classList.remove('blue', 'pink');
    if (myRole === 'blue') {
      roleChipBtn.textContent = '💙 Cowo';
      roleChipBtn.classList.add('blue');
    } else if (myRole === 'pink') {
      roleChipBtn.textContent = '🩷 Cewe';
      roleChipBtn.classList.add('pink');
    } else {
      roleChipBtn.textContent = '👀 Auto';
    }

    document.querySelectorAll('[data-set-role]').forEach(btn => {
      if (btn.classList.contains('role-opt')) {
        btn.classList.toggle('active', btn.dataset.setRole === myRole);
      }
    });

    coupleDock.classList.toggle('show', myRole === 'blue' || myRole === 'pink');

    if (localStorage.getItem('natla_role_picked')) {
      roleBanner.classList.remove('show');
    } else {
      roleBanner.classList.add('show');
    }
  }

  function setRole(newRole) {
    myRole = newRole;
    localStorage.setItem('natla_role', newRole);
    localStorage.setItem('natla_role_picked', '1');
    rolePop.classList.remove('open');
    applyRoleUI();
    updatePresenceInFirebase();
    if (newRole !== 'auto') {
      const m = getMascot(newRole);
      if (m) {
        m.jumpVel = -4.5;
        spawnParticles(m.x, m.y - 65, '♥', 3);
        pushMyCharState(true);
      }
      playTone(620, 'sine', 0.09);
    }
  }

  roleChipBtn.addEventListener('click', e => {
    e.stopPropagation();
    timePop.classList.remove('open');
    rolePop.classList.toggle('open');
  });

  document.querySelectorAll('[data-set-role]').forEach(btn => {
    btn.addEventListener('click', () => setRole(btn.dataset.setRole));
  });

  document.getElementById('btnKiss').addEventListener('click', () => {
    if (myRole === 'auto') return;
    startCoupleAction('kiss', myRole, true);
  });

  document.getElementById('btnHug').addEventListener('click', () => {
    if (myRole === 'auto') return;
    startCoupleAction('hug', myRole, true);
  });

  document.getElementById('btnSitDesk').addEventListener('click', () => {
    if (myRole === 'auto') return;
    const me = getMascot(myRole);
    if (me) {
      commandMascotToActivity(me, 'desk');
      playTone(520, 'sine', 0.07);
    }
  });

  document.getElementById('btnSitBeanbag').addEventListener('click', () => {
    if (myRole === 'auto') return;
    const me = getMascot(myRole);
    if (me) {
      commandMascotToActivity(me, 'beanbag');
      playTone(540, 'sine', 0.07);
    }
  });

  // =========================================================================
  // 8. MODAL PORTAL 3D (KAPSUL WAKTU, PHOTOBOOTH, GAMES)
  // =========================================================================
  const modal = document.getElementById('portalModal');
  const urlInput = document.getElementById('portalUrlInput');
  const fullBtn = document.getElementById('portalFullBtn');
  const iframe = document.getElementById('portalIframe');

  function openPortal(key) {
    const info = PORTALS[key];
    if (!info) return;
    playTone(480, 'sine', 0.08, 720);
    urlInput.value = info.url;
    fullBtn.href = info.url;
    iframe.src = info.url;
    modal.classList.add('open');
  }

  function closePortal() {
    playTone(440, 'sine', 0.07, 300);
    modal.classList.remove('open');
    setTimeout(() => { iframe.src = 'about:blank'; }, 300);
  }

  document.querySelectorAll('[data-portal]').forEach(btn => {
    btn.addEventListener('click', () => openPortal(btn.dataset.portal));
  });
  document.getElementById('portalCloseBtn').addEventListener('click', closePortal);
  modal.addEventListener('click', e => { if (e.target === modal) closePortal(); });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) closePortal();
  });
  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      let val = urlInput.value.trim();
      if (!/^https?:\/\//i.test(val)) val = 'https://' + val;
      iframe.src = val;
      fullBtn.href = val;
    }
  });

  // =========================================================================
  // 9. KONTROL HUD ATAS (WAKTU SERVER TERSINKRONISASI, LAMPU, DECOR, AUDIO, TEMA)
  // =========================================================================
  const clockText = document.getElementById('clockText');
  const timePop = document.getElementById('timePop');
  const timeSlider = document.getElementById('timeSlider');
  const timeModeLabel = document.getElementById('timeModeLabel');

  function syncTimeControlsUI() {
    const activeHr = getActiveHour();
    timeSlider.value = activeHr;
    if (timeModeLabel) {
      timeModeLabel.textContent = roomState.manualHour === null ? 'Waktu Server (Sync)' : 'Simulasi Waktu (Sync)';
    }
    document.querySelectorAll('[data-hr]').forEach(b => {
      b.classList.toggle('active', roomState.manualHour !== null && parseInt(b.dataset.hr, 10) === roomState.manualHour);
    });
    document.getElementById('btnAutoTime').classList.toggle('active', roomState.manualHour === null);
    updateClockDisplay();
  }

  function updateClockDisplay() {
    if (roomState.manualHour === null) {
      const { hour, minute } = getServerClockParts();
      clockText.textContent = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
    } else {
      clockText.textContent = String(roomState.manualHour).padStart(2, '0') + ':00';
    }
  }
  setInterval(updateClockDisplay, 1000);
  syncTimeControlsUI();

  clockText.addEventListener('click', e => {
    e.stopPropagation();
    rolePop.classList.remove('open');
    timePop.classList.toggle('open');
  });
  timeSlider.addEventListener('input', () => {
    roomState.manualHour = parseInt(timeSlider.value, 10);
    syncTimeControlsUI();
  });
  timeSlider.addEventListener('change', () => {
    roomState.manualHour = parseInt(timeSlider.value, 10);
    syncTimeControlsUI();
    pushState();
  });
  document.querySelectorAll('[data-hr]').forEach(btn => {
    btn.addEventListener('click', () => {
      roomState.manualHour = parseInt(btn.dataset.hr, 10);
      syncTimeControlsUI();
      pushState();
      playTone(500, 'sine', 0.06);
    });
  });
  document.getElementById('btnAutoTime').addEventListener('click', () => {
    roomState.manualHour = null;
    syncTimeControlsUI();
    pushState();
    timePop.classList.remove('open');
    playTone(560, 'sine', 0.06);
  });

  function updateUIButtons() {
    document.getElementById('btnLamp').classList.toggle('active', roomState.lampOn);
  }

  document.getElementById('btnLamp').addEventListener('click', () => {
    roomState.lampOn = !roomState.lampOn;
    updateUIButtons();
    playTone(roomState.lampOn ? 620 : 380, 'sine', 0.08);
    pushState();
  });

  const btnDecor = document.getElementById('btnDecor');
  const btnResetDecor = document.getElementById('btnResetDecor');
  btnDecor.addEventListener('click', () => {
    decorMode = !decorMode;
    btnDecor.classList.toggle('active', decorMode);
    btnResetDecor.style.display = decorMode ? 'inline-flex' : 'none';
    playTone(500, 'triangle', 0.07);
  });
  btnResetDecor.addEventListener('click', () => {
    roomState.decors = JSON.parse(JSON.stringify(DEFAULT_DECORS));
    pushState();
    playTone(420, 'triangle', 0.1);
  });

  document.getElementById('btnAudio').addEventListener('click', function() {
    audioEnabled = !audioEnabled;
    this.textContent = audioEnabled ? '🔊' : '🔇';
  });

  document.getElementById('btnTheme').addEventListener('click', function() {
    document.body.classList.toggle('dark');
    this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  });

  // Start!
  applyRoleUI();
  initFirebase();
  loadAllAssets(() => {
    updateUIButtons();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
